<style>
:root{
  --navy:#0d1f35; --navy-d:#091520; --navy-l:#132b45;
  --card:rgba(19,43,69,.66); --line:rgba(74,179,232,.2);
  --blue:#4ab3e8; --hl:#1162cf;
  --green:#25d366;
  --text:#e4eaf0; --text-m:#a3b3c4; --text-d:#7d92a8; --white:#fff;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 24px}
.tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
h1{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.015em;color:var(--white);margin:0 0 18px}
h1 span{color:var(--blue)}
label{display:block;font-size:13px;color:var(--text-m);margin-bottom:6px}
input{width:100%;background:var(--navy-d);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:400 16px var(--font);padding:12px 14px;outline:none}
input:focus{border-color:var(--blue)}
button{width:100%;margin-top:14px;background:var(--green);color:var(--navy);border:0;border-radius:var(--r-pill);font:700 16px var(--font);padding:13px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:20px;margin:12px 0 0;font-size:13px;color:#ff8a8a}
</style></head><body>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, chave, b64(P.d)));
}
const f = document.getElementById('f'), s = document.getElementById('s'), b = document.getElementById('b'), msg = document.getElementById('msg');
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.textContent = '';
  if (!s.value.trim()) { msg.textContent = 'Digite a frase-senha.'; return; }
  if (!(window.crypto && crypto.subtle)) { msg.textContent = 'Este navegador só abre a página pelo endereço https.'; return; }
  b.disabled = true; b.textContent = 'Abrindo…';
  try { const h = await abrir(s.value.trim().toLowerCase().replace(/\s+/g, '-')); document.open(); document.write(h); document.close(); }
  catch (err) { msg.textContent = 'Frase-senha incorreta.'; b.disabled = false; b.textContent = 'Abrir'; s.select(); }
});
