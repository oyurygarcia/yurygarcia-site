<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado · LAP</title>
<meta name="description" content="Pagamento confirmado. O acesso ao LAP · Liderança de Alta Performance chega no e-mail informado em poucos minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0d1f35;--text:#e4eaf0;--blue:#4ab3e8}
body{background:var(--navy);color:var(--text);font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;font-size:1.05rem;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center;padding:56px 16px}
.wrap{max-width:600px;margin:0 auto;width:100%}
.label{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
h1{font-family:'Outfit',system-ui,sans-serif;font-weight:800;font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.1;color:#fff;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--blue)}
.divider{width:50px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--blue),transparent);margin:18px 0 24px}
p{margin-bottom:28px}
.btn{display:inline-block;font-weight:700;font-size:1.05rem;color:var(--navy);background:var(--blue);border-radius:12px;padding:16px 28px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{text-align:center;padding:32px 16px 40px;font-weight:700;letter-spacing:.14em;color:rgba(74,179,232,.7);font-size:.85rem}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1>Pagamento <em>confirmado.</em></h1>
    <div class="divider"></div>
    <p>O seu acesso chega no e-mail que você informou em poucos minutos. Se não aparecer, olhe também no spam e em promoções.</p>
    <a class="btn" href="https://yury-garcia.memberkit.com.br/">Entrar na área de alunos</a>
  </div>
</main>
<footer>oyurygarcia</footer>
</body>
</html>
